name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: yes | sdkmanager --licenses || true

      - name: Decode launcher icons
        run: |
          set -e
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            f="icons/mipmap-${dens}_ic_launcher.b64"
            if [ -f "$f" ] && [ -s "$f" ]; then
              mkdir -p "app/src/main/res/mipmap-${dens}"
              if base64 -d "$f" > "app/src/main/res/mipmap-${dens}/ic_launcher.png" 2>/dev/null; then
                cp "app/src/main/res/mipmap-${dens}/ic_launcher.png" "app/src/main/res/mipmap-${dens}/ic_launcher_round.png"
                echo "decoded $dens"
              fi
            fi
          done
          # Prefer any successfully decoded xxxhdpi as adaptive foreground
          if [ -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable/ic_launcher_foreground.png
            rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          elif [ -f app/src/main/res/mipmap-mdpi/ic_launcher.png ]; then
            cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/drawable/ic_launcher_foreground.png
            rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          fi
          ls -la app/src/main/res/mipmap-* 2>/dev/null || true
          ls -la app/src/main/res/drawable/ic_launcher* 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

      - name: Build
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          grep -E "^e: |error:|Unresolved|FAILED" build.log || true
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 5

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Nava-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
